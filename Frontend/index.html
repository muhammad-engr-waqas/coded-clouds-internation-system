<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coded Clouds — Internal Management System</title>

    <!--
      Favicon strategy:
      1. If /logo.png exists in /public → uses that (real Coded Clouds logo)
      2. Fallback → inline SVG cloud+code-brackets icon in brand colours
      The script below tries /logo.png first, falls back to SVG on error.
    -->
    <script>
      (function () {
        var svgFavicon =
          "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E" +
          "%3Cdefs%3E%3ClinearGradient id='cg' x1='0' y1='0' x2='1' y2='1'%3E" +
          "%3Cstop offset='0%25' stop-color='%230284c7'/%3E" +
          "%3Cstop offset='100%25' stop-color='%2338bdf8'/%3E" +
          "%3C/linearGradient%3E%3C/defs%3E" +
          "%3Crect width='64' height='64' rx='14' fill='%23ffffff'/%3E" +
          "%3Cellipse cx='20' cy='36' rx='14' ry='10' fill='url(%23cg)'/%3E" +
          "%3Cellipse cx='30' cy='30' rx='12' ry='9' fill='url(%23cg)'/%3E" +
          "%3Cellipse cx='44' cy='34' rx='14' ry='10' fill='url(%23cg)'/%3E" +
          "%3Cellipse cx='32' cy='40' rx='22' ry='10' fill='url(%23cg)'/%3E" +
          "%3Cpath d='M21 28l-5 5 5 5' stroke='%23ffffff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E" +
          "%3Cpath d='M43 28l5 5-5 5' stroke='%23ffffff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E" +
          "%3Cline x1='30' y1='27' x2='34' y2='39' stroke='%23ffffff' stroke-width='2.5' stroke-linecap='round'/%3E" +
          "%3C/svg%3E";

        function setFavicon(href, type) {
          var existing = document.querySelector("link[rel~='icon']");
          if (existing) existing.parentNode.removeChild(existing);
          var link = document.createElement("link");
          link.rel = "icon";
          link.type = type || "image/svg+xml";
          link.href = href;
          document.head.appendChild(link);
        }

        // Try real logo first
        var img = new Image();
        img.onload = function () {
          setFavicon("/logo.png", "image/png");
        };
        img.onerror = function () {
          setFavicon(svgFavicon, "image/svg+xml");
        };
        img.src = "/logo.png?" + Date.now();

        // Set SVG immediately while we wait
        setFavicon(svgFavicon, "image/svg+xml");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
