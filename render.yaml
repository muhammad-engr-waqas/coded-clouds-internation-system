services:

  # ── 1. Backend API (Node.js web service) ──────────────────────────────────
  - type: web
    name: coded-clouds-internation-system-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: REDIS_URL
        fromService:
          name: ccims-redis
          type: redis
          property: connectionString
      - key: CLIENT_URL
        value: https://coded-clouds-internation-system.onrender.com
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_FILE_SIZE_MB
        value: 10
      - key: LATE_CUTOFF_TIME
        value: "09:15"

  # ── 2. Frontend React SPA (Static Site) ───────────────────────────────────
  # Static Site type automatically serves _redirects file from dist/
  # so /* → /index.html works on every page refresh.
  - type: web
    name: coded-clouds-internation-system
    runtime: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    envVars:
      - key: VITE_API_URL
        value: https://coded-clouds-internation-system-backend.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://coded-clouds-internation-system-backend.onrender.com

  # ── 3. Redis ───────────────────────────────────────────────────────────────
  - type: redis
    name: ccims-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
