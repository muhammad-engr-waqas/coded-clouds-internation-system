# render.yaml — Render.com Infrastructure as Code
# Single web service: builds Frontend then starts Backend (which serves both API + SPA)

services:

  # ── Combined Backend + Frontend ────────────────────────────────────────────
  - type: web
    name: coded-clouds-internation-system
    runtime: node
    rootDir: backend
    # Build: install backend deps, then install and build frontend
    # Render sets CWD to rootDir (backend/) during build AND runtime
    buildCommand: npm install && cd ../Frontend && npm install && npm run build && echo "=== dist contents ===" && ls ../Frontend/dist
    # Start: backend Express server serves both /api/* and the React SPA
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: REDIS_URL
        fromService:
          name: ccims-redis
          type: redis
          property: connectionString
      - key: CLIENT_URL
        value: https://coded-clouds-internation-system.onrender.com
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_FILE_SIZE_MB
        value: 10
      - key: LATE_CUTOFF_TIME
        value: "09:15"

  # ── Redis ─────────────────────────────────────────────────────────────────
  - type: redis
    name: ccims-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
